services:
  mediaserver:
    image: samvr-auth-test:local
    build:
      context: ../../..
      target: backend
    environment:
      DATABASE_URL: postgresql://postgres:test-database-password@db:5432/samvr_auth_test
      EXPOSED_MEDIASOUP_PORT: "9001"
      JWT_SECRET: test-jwt-secret
      JWT_ISSUER: samvr-auth-test
      JWT_AUDIENCE: samvr-auth-test
    command: ["pnpm", "--filter", "mediaserver", "exec", "tsx", "src/index.ts"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('node:net').connect(9001,'127.0.0.1');s.on('connect',()=>s.end());s.on('error',()=>process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30

  tests:
    environment:
      MEDIA_TEST_URL: ws://mediaserver:9001
      DATABASE_URL: postgresql://postgres:test-database-password@db:5432/samvr_auth_test
    command: ["node", "--test", "/app/backend/mediaserver/test/vr-space-authorization.test.mjs"]
    depends_on:
      mediaserver:
        condition: service_healthy
